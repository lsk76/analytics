# ============================================================================
# nginx site для tg-event-analytics (аналітичний сервер).
# Термінує TLS і проксіює на gunicorn (127.0.0.1:8001, лише loopback).
#
# Розрахований на nginx.org stable (розкладка conf.d/, не sites-enabled/).
# Встановлення (ПОРЯДОК ВАЖЛИВИЙ — сертифікат ДО ввімкнення цього конфігу,
# інакше nginx не стартує через :443 без cert). Повний порядок — deploy/README.md
# крок 4. Стисло:
#   sudo certbot certonly --nginx -d analytics.matter-d.pro   # 1) отримати cert
#   sudo cp deploy/nginx/tg-analytics.conf /etc/nginx/conf.d/tg-analytics.conf
#   sudo rm -f /etc/nginx/conf.d/default.conf                  # 2) увімкнути site
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================================

# Не світити версію nginx у заголовку Server та на сторінках помилок.
server_tokens off;

# Rate-limit зона для логіну адмінки (захист від брутфорсу пароля).
# 5 запитів/хв на IP; burst 10. Оголошується на http-рівні.
limit_req_zone $binary_remote_addr zone=adminlogin:10m rate=5r/m;

# --- HTTP → HTTPS редирект (+ ACME-challenge для certbot) --------------------
server {
    listen 80;
    listen [::]:80;
    server_name analytics.matter-d.pro;

    # certbot webroot renew
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://$host$request_uri; }
}

# --- HTTPS ------------------------------------------------------------------
server {
    # Сервер працює на nginx.org stable (≥1.25) → сучасна директива "http2 on;".
    # (На штатному nginx 1.18 з Ubuntu 22.04 треба натомість "listen 443 ssl http2;".)
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name analytics.matter-d.pro;

    # Сертифікат від Let's Encrypt. Файли створює certbot ДО ввімкнення цього
    # конфігу (див. deploy/README.md крок 4 — спершу `certbot certonly`, потім
    # копіюємо цей файл). options-ssl-nginx.conf і ssl-dhparams.pem ставить
    # пакет python3-certbot-nginx.
    ssl_certificate     /etc/letsencrypt/live/analytics.matter-d.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/analytics.matter-d.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Ліміт розміру аплоуду (адмінка невелика; захист від сміття).
    client_max_body_size 20m;

    # Безпекові заголовки (HSTS дублює Django-налаштування).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # Статику Django віддає whitenoise; окремий alias не потрібен.

    # Proxy-заголовки для gunicorn (вбудовані, щоб не залежати від
    # дистрибутивного /etc/nginx/proxy_params). X-Forwarded-Proto → Django
    # SECURE_PROXY_SSL_HEADER бачить https за проксі.
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Логін адмінки — під rate-limit (окрема location ДО загальної).
    location = /admin/login/ {
        limit_req zone=adminlogin burst=10 nodelay;
        proxy_pass http://127.0.0.1:8001;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_read_timeout 120s;   # довгі адмін-агрегації (графіки/матриця)
    }
}
