# ============================================================================
# nginx site для DEV-стенду (deploy/README.md, «Dev-стенд на тому ж сервері»).
# Лежить ПОРУЧ із tg-analytics.conf на тому ж сервері: інший server_name,
# інші upstream-порти (web 8002, mcp 8766), своя rate-limit зона.
#
# Порядок увімкнення (як у проді — cert ДО https-блоку):
#   1) тимчасово лише :80-блок → nginx -t && reload
#   2) sudo certbot certonly --webroot -w /var/www/html -d dev.analytics.matter-d.pro
#   3) повний файл → nginx -t && reload
# ============================================================================

limit_req_zone $binary_remote_addr zone=adminlogin_dev:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name dev.analytics.matter-d.pro;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dev.analytics.matter-d.pro;

    ssl_certificate     /etc/letsencrypt/live/dev.analytics.matter-d.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.analytics.matter-d.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    # Dev не індексувати.
    add_header X-Robots-Tag "noindex, nofollow" always;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /admin/login/ {
        limit_req zone=adminlogin_dev burst=10 nodelay;
        proxy_pass http://127.0.0.1:8002;
    }

    # MCP dev-стека (127.0.0.1:8766) — якщо сервіс mcp у dev піднятий.
    location = /mcp {
        proxy_pass http://127.0.0.1:8766/mcp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    location ~ ^/(authorize|token|register|revoke)$ {
        proxy_pass http://127.0.0.1:8766;
        proxy_read_timeout 60s;
    }
    location ~ ^/\.well-known/oauth-(authorization-server|protected-resource) {
        proxy_pass http://127.0.0.1:8766;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_read_timeout 120s;
    }
}
