name: tg-event-analytics

# shared config for every stage worker (reuses the web image)
x-worker: &worker
  image: tg-event-analytics-web:latest
  env_file: .env
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: 5432
  volumes:
    - ./backend:/app/backend
  depends_on:
    db:
      condition: service_healthy
    web:
      condition: service_started
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tg_events}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"          # host 5433 (5432 is taken by pso)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tg_events}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    image: tg-event-analytics-web:latest
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      - ./backend:/app/backend   # live code reload
    ports:
      - "8001:8000"          # host 8001 (8000 is taken by pso)
    depends_on:
      db:
        condition: service_healthy

  # --- stage workers (reuse the web image) ----------------------------------
  worker-collect:    { <<: *worker, command: python manage.py run_worker --stage collect }
  worker-enrich:     { <<: *worker, command: python manage.py run_worker --stage enrich }
  worker-precluster: { <<: *worker, command: python manage.py run_worker --stage precluster }
  worker-classify:   { <<: *worker, command: python manage.py run_worker --stage classify }
  worker-dedup:      { <<: *worker, command: python manage.py run_worker --stage dedup }
  worker-review:     { <<: *worker, command: python manage.py run_worker --stage review }

volumes:
  pgdata:
