{% extends "admin/base_site.html" %}

{% block content %}
<h1>🔗 Посилання на вибрані події ({{ links|length }})</h1>
<textarea id="links" readonly
          style="width:100%;height:320px;font-family:monospace;font-size:13px;
                 background:var(--body-bg);color:var(--body-fg);
                 border:1px solid var(--border-color);border-radius:6px;padding:10px;"
>{% for l in links %}{{ l }}
{% endfor %}</textarea>
<div style="margin-top:12px;display:flex;gap:10px;">
  <button id="copy-btn" class="button default" style="cursor:pointer;">📋 Скопіювати все</button>
  <a class="button" href="{% url 'admin:analysis_event_changelist' %}">← Назад до списку</a>
</div>
<script>
document.getElementById('copy-btn').addEventListener('click', function () {
  var ta = document.getElementById('links');
  navigator.clipboard.writeText(ta.value).then(() => {
    this.textContent = '✅ Скопійовано';
    setTimeout(() => { this.textContent = '📋 Скопіювати все'; }, 2000);
  }).catch(() => { ta.select(); document.execCommand('copy'); });
});
</script>
{% endblock %}
