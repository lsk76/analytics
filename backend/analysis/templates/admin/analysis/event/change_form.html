{% extends "admin/change_form.html" %}

{% block object-tools-items %}
  {% if original.pk %}
  <li>
    <a class="historylink"
       href="{% url 'admin:analysis_event_posts' original.pk %}">
      📋 Усі пости події ({{ original.post_count }})
    </a>
  </li>
  {% endif %}
  {{ block.super }}
{% endblock %}

{% block submit_buttons_bottom %}
{{ block.super }}
<div class="submit-row" style="display:flex;gap:10px;">
  <input type="submit" value="✅ Схвалити подію" name="_approve_event"
         style="background:#1a7f37;color:#fff;border:none;">
  <input type="submit" value="❌ Відхилити подію" name="_reject_event"
         style="background:#b91c1c;color:#fff;border:none;">
</div>
{% endblock %}
