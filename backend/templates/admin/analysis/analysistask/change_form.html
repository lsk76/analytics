{% extends "admin/change_form.html" %}

{% block extrahead %}
{{ block.super }}
<style>
  .flow-cards { display:flex; gap:10px; margin:8px 0 4px; }
  .flow-card { flex:1; max-width:390px; border:2px solid var(--border-color,#ccc);
               border-radius:10px; padding:10px 14px; cursor:pointer; user-select:none; }
  .flow-card.active { border-color: var(--link-fg,#417690); background: rgba(65,118,144,.08); }
  .flow-card b { display:block; margin-bottom:2px; }
  .flow-card small { color: var(--body-quiet-color,#777); line-height:1.35; display:block; }
  .flow-switch-hint { margin:6px 0; padding:8px 12px; border-radius:6px;
                      background:rgba(245,158,11,.12); border:1px dashed #d97706; }
</style>
{% endblock %}

{% block admin_change_form_document_ready %}
{{ block.super }}
<script>
(function() {
  const sel = document.getElementById('id_pipeline');
  if (!sel) return;
  const saved = sel.value;   // конвеєр, під який СЕРВЕР відрендерив розділи

  // 1) картки-перемикач замість голого select
  const CARDS = [
    ['events',  '📰 Пошук подій',
     'збір за пошуковим запитом → класифікація → дедуплікація → аудит і резонансність'],
    ['monitor', '💬 Моніторинг коментарів',
     'обрані канали → фільтрація → прескрін → тегування агентами → подія на кожен коментар'],
    ['research', '🔬 Тематичне дослідження',
     'канали республік → рубрики (ключові слова) → агенти підтверджують → групування в події'],
  ];
  const wrap = document.createElement('div');
  wrap.className = 'flow-cards';
  CARDS.forEach(([val, title, desc]) => {
    const c = document.createElement('div');
    c.className = 'flow-card'; c.dataset.val = val;
    c.innerHTML = '<b>' + title + '</b><small>' + desc + '</small>';
    c.addEventListener('click', () => { sel.value = val; apply(); });
    wrap.appendChild(c);
  });
  const pipelineRow = sel.closest('.form-row, .field-pipeline');
  if (pipelineRow) {
    pipelineRow.parentNode.insertBefore(wrap, pipelineRow);
    pipelineRow.style.display = 'none';
  }

  // підказка: розділи етапів рендеряться під ЗБЕРЕЖЕНИЙ конвеєр
  const hint = document.createElement('div');
  hint.className = 'flow-switch-hint';
  hint.style.display = 'none';
  hint.textContent = 'Конвеєр змінено — збережіть задачу, щоб побачити етапи цього конвеєра.';
  wrap.parentNode.insertBefore(hint, wrap.nextSibling);

  function apply() {
    const v = sel.value;
    wrap.querySelectorAll('.flow-card').forEach(c =>
      c.classList.toggle('active', c.dataset.val === v));
    hint.style.display = (v !== saved) ? '' : 'none';
  }
  sel.addEventListener('change', apply);
  apply();

  // 2) канали моніторингу — одразу під розділ «Етап 1 — Збір (TeleZip + канали)»
  const chats = document.getElementById('monitor_chats-group');
  const rubrics = document.getElementById('rubrics-group');
  const collectFs = document.querySelector('fieldset.mon-collect-fs');
  const rubricsFs = document.querySelector('fieldset.rubrics-fs');
  if (chats) {
    if ((saved === 'monitor' || saved === 'research') && collectFs) {
      collectFs.after(chats);        // канали одразу під розділом збору
    } else if (saved === 'events') {
      chats.style.display = 'none';   // для подій канали не потрібні
    }
  }
  if (rubrics) {
    if (saved === 'research' && rubricsFs) {
      rubricsFs.after(rubrics);       // рубрики під своїм етапом
    } else if (saved !== 'research') {
      rubrics.style.display = 'none';
    }
  }
})();
</script>
{% endblock %}
