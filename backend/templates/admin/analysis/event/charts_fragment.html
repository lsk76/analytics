{% load static %}{% comment %}
  Minimal HTML — only the charts body + its styles + scripts. Used by the inline
  "show charts" toggle on the EventAdmin changelist (fetched via JS and injected).
{% endcomment %}
<style>
  .charts-wrap { max-width: 1400px; margin: 12px auto; }
  .charts-meta { display:flex; align-items:center; gap:16px; flex-wrap:wrap;
                 padding: 10px 14px; margin:10px 0;
                 background: var(--darkened-bg); border:1px solid var(--border-color);
                 border-radius:8px; color: var(--body-fg); }
  .charts-meta strong { font-size: 18px; }
  .gran-switch a { padding: 4px 10px; border-radius:6px; text-decoration:none;
                   border:1px solid var(--border-color); color: var(--body-fg);
                   background: var(--body-bg); margin-right:4px; }
  .gran-switch a.active { background: var(--link-fg); color: var(--button-fg); border-color: transparent; }
  .charts-grid { display:grid; gap:16px; grid-template-columns: 1fr 1fr; }
  .chart-card { background: var(--body-bg); border:1px solid var(--border-color);
                border-radius:8px; padding:14px; }
  .chart-card.full { grid-column: 1 / -1; }
  .chart-card h3 { margin: 0 0 10px; font-size:15px; color: var(--body-fg);
                   display:flex; align-items:center; gap:12px; }
  .inline-top { display:inline-flex; align-items:center; gap:6px;
                margin-left:auto; font-size:12px; font-weight:normal; }
  .inline-top input[type=number] {
    width:64px; background: var(--body-bg); color: var(--body-fg);
    border:1px solid var(--border-color); border-radius:4px; padding:2px 6px;
  }
  .inline-top button { padding:2px 8px; }
  .chart-canvas-wrap { position:relative; height: 280px; }
  .chart-canvas-wrap.tall { height: 380px; }
  .tag-section h2 { color: var(--body-fg); margin: 18px 0 8px; font-size:18px; }
  .tag-config { display:flex; flex-wrap:wrap; align-items:center; gap:14px;
                padding:10px 12px; margin: 8px 0 14px;
                background: var(--darkened-bg); border:1px solid var(--border-color);
                border-radius:8px; color: var(--body-fg); font-size:13px; }
  .tag-config .cats { display:inline-flex; flex-wrap:wrap; gap:6px; }
  .tag-config .cat-chip { display:inline-flex; align-items:center; gap:4px;
                          padding:3px 8px; border:1px solid var(--border-color);
                          border-radius:14px; cursor:pointer; }
  .tag-config input[type=number], .tag-config select {
    background: var(--body-bg); color: var(--body-fg);
    border:1px solid var(--border-color); border-radius:4px; padding:2px 6px;
  }
  .tag-grid-1 { grid-template-columns: 1fr; }
  .tag-grid-2 { grid-template-columns: 1fr 1fr; }
  .tag-grid-3 { grid-template-columns: 1fr 1fr 1fr; }
  .empty { color: var(--body-quiet-color); padding:20px; text-align:center; }
  .filter-panel { display:none; }   /* hide redundant filter panel — list page has filters */
</style>
{% include "admin/analysis/event/_charts_body.html" %}
