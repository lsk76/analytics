{% load i18n static %}
<details data-filter-title="{{ title }}"{% if spec.filter_is_active %} open{% endif %}>
<summary>{% blocktranslate with filter_title=title %} By {{ filter_title }} {% endblocktranslate %}</summary>

<script>
if (!document.getElementById('select2-css-loaded')) {
    var link = document.createElement('link');
    link.id = 'select2-css-loaded';
    link.rel = 'stylesheet';
    link.href = '{% static "vendor/select2/select2.min.css" %}';
    document.head.appendChild(link);
}
</script>

<style>
#changelist-filter .facet-autocomplete-wrapper { padding: 4px 8px; }
#changelist-filter .facet-autocomplete-wrapper select { width: 100%; min-width: 150px; }
#changelist-filter .facet-autocomplete-wrapper .select2-container { width: 100% !important; margin: 5px 0; }
.select2-container--default .select2-selection--multiple {
    background: var(--darkened-bg, #f8f8f8);
    border: 1px solid var(--hairline-color, #ccc);
    border-radius: 4px;
}
.select2-container--default .select2-selection--multiple .select2-selection__choice {
    background: var(--primary, #417690); color: var(--primary-fg, #fff);
    border: none; border-radius: 3px; padding: 2px 8px; margin: 3px;
}
.select2-container--default .select2-results__option--highlighted.select2-results__option--selectable {
    background: var(--primary, #417690); color: var(--primary-fg, #fff);
}
/* Випадайка select2 рендериться в <body>, тож стилі глобальні; кольори — зі
   змінних адмінки, щоб темна тема лишалась читабельною (був білий фон + сірий текст). */
.select2-container--default .select2-dropdown {
    background: var(--body-bg, #fff); color: var(--body-fg, #333);
    border: 1px solid var(--hairline-color, #ccc); border-radius: 4px;
}
.select2-container--default .select2-results__option {
    color: var(--body-fg, #333); padding: 6px 10px; line-height: 1.3;
}
.select2-container--default .select2-results__option[aria-selected=true],
.select2-container--default .select2-results__option--selected {
    background: var(--selected-row, #ffc); color: var(--body-fg, #333);
}
.select2-container--default .select2-search--dropdown { padding: 6px; }
.select2-container--default .select2-search--dropdown .select2-search__field {
    background: var(--darkened-bg, #f8f8f8); color: var(--body-fg, #333);
    border: 1px solid var(--hairline-color, #ccc); border-radius: 4px; padding: 5px 8px;
}
/* select2 4.1: пошукове поле — СУСІД .select2-selection__rendered, а не його
   дитина, тож порожній rendered давав зайвий рядок зверху (див. скріншот).
   Робимо контейнер flex-рядком, rendered — display:contents, поле — без рамки. */
.select2-container--default .select2-selection--multiple {
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
    min-height: 34px; padding: 3px 6px; box-sizing: border-box; }
.select2-container--default .select2-selection--multiple .select2-selection__rendered {
    display: contents; }
.select2-container--default .select2-selection--multiple .select2-selection__choice {
    display: inline-flex; align-items: center; gap: 6px; margin: 0; padding: 2px 8px; line-height: 1.4; }
.select2-container--default .select2-selection--multiple .select2-selection__choice__display { padding: 0; }
.select2-container--default .select2-selection--multiple .select2-selection__choice__remove {
    position: static; order: 2; border: 0; background: none; padding: 0; margin: 0;
    color: var(--primary-fg, #fff); font-weight: 700; line-height: 1; }
.select2-container--default .select2-selection--multiple .select2-selection__choice__remove:hover {
    background: none; color: var(--primary-fg, #fff); opacity: .8; }
.select2-container--default .select2-search--inline { flex: 1; min-width: 60px; display: flex; }
.select2-container--default .select2-search--inline .select2-search__field {
    border: 0 !important; background: transparent !important; box-shadow: none; resize: none;
    color: var(--body-fg, #333); margin: 0; padding: 0 2px; height: 26px; line-height: 26px;
    min-width: 60px; width: 100% !important; font: inherit; }
.select2-container--default .select2-search--inline .select2-search__field::placeholder { color: var(--body-quiet-color, #666); }
/* Загальний хрестик «очистити все» не потрібен — є кнопка «Очистити». */
.select2-container--default .select2-selection--multiple .select2-selection__clear { display: none; }
</style>

<ul>
    <li class="facet-autocomplete-wrapper">
        <select id="facet_ac_{{ spec.parameter_name }}"
                class="facet-autocomplete-select"
                data-filter-param="{{ spec.parameter_name }}"
                multiple>
            {% for choice in choices %}
                {% if choice.value and choice.value != '__all__' %}
                <option value="{{ choice.value }}"{% if choice.selected %} selected{% endif %}>{{ choice.display }}</option>
                {% endif %}
            {% endfor %}
        </select>
        <button type="button" id="apply_{{ spec.parameter_name }}" class="button">{% trans "Search" %}</button>
        <button type="button" id="clear_{{ spec.parameter_name }}" class="button default">{% trans "Clear" %}</button>
    </li>
</ul>

<script>
(function() {
    function start() {
        if (typeof django === 'undefined' || typeof django.jQuery === 'undefined') {
            return setTimeout(start, 100);
        }
        var $ = django.jQuery;
        if (typeof $.fn.select2 !== 'undefined') return init($);
        if (window._select2Loading) return setTimeout(start, 100);
        window._select2Loading = true;
        var oJ = window.jQuery, oD = window.$;
        window.jQuery = $; window.$ = $;
        var s = document.createElement('script');
        s.src = '{% static "vendor/select2/select2.min.js" %}';
        s.onload = function() { window.jQuery = oJ; window.$ = oD; window._select2Loading = false; init(django.jQuery); };
        s.onerror = function() { window.jQuery = oJ; window.$ = oD; window._select2Loading = false; };
        document.head.appendChild(s);
    }
    function init($) {
        var $sel = $('#facet_ac_{{ spec.parameter_name }}');
        if ($sel.length === 0 || $sel.data('select2')) return;
        var param = $sel.data('filter-param');
        $sel.select2({
            placeholder: '{{ spec.placeholder|default:"Пошук..."|escapejs }}',
            allowClear: false, width: '100%', closeOnSelect: false
        });
        $('#apply_{{ spec.parameter_name }}').on('click', function() {
            var url = new URL(window.location);
            url.searchParams.delete(param);
            ($sel.val() || []).forEach(function(v) { if (v) url.searchParams.append(param, v); });
            window.location = url.toString();
        });
        $('#clear_{{ spec.parameter_name }}').on('click', function() {
            $sel.val(null).trigger('change');
            var url = new URL(window.location);
            url.searchParams.delete(param);
            window.location = url.toString();
        });
    }
    if (document.readyState === 'complete') setTimeout(start, 100);
    else window.addEventListener('load', function() { setTimeout(start, 100); });
})();
</script>
</details>
