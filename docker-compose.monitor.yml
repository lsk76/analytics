name: tg-event-analytics

# Production-стек ДЛЯ СЕРВЕРА БЕЗ АНАЛІТИКИ: тільки моніторинг інформпростору
# (infospace-конвеєр) + ведення ТГ (publish). Важких analytics-воркерів
# (collect/enrich/precluster/classify/dedup/review) тут НЕМАЄ — на цьому сервері
# збір по аналітиці не відбувається.
#
# Відмінності від dev docker-compose.yml:
#   - DEBUG=false, gunicorn замість runserver, collectstatic + migrate на старті
#   - без монтування ./backend (код зашитий в образ; Telethon-сесія — в БД, не у файлі)
#   - порт БД назовні не публікується
#
# Запуск:
#   docker compose -f docker-compose.monitor.yml build
#   docker compose -f docker-compose.monitor.yml up -d

x-worker: &worker
  image: tg-event-analytics-web:latest
  env_file: .env
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: 5432
    DJANGO_DEBUG: "false"
  depends_on:
    db:
      condition: service_healthy
    web:
      condition: service_started
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    # shm_size тут НЕ потрібен: важкі хеш-агрегації над мультимільйонною Post
    # (адмін-графіки аналітики) на цьому сервері не виконуються. Дефолтних 64MB
    # /dev/shm для моніторингу/публікації достатньо.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tg_events}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Порт БД назовні не публікуємо (доступ лише всередині compose-мережі).
    # Для дебагу розкоментуй:
    # ports:
    #   - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tg_events}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    image: tg-event-analytics-web:latest
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_DEBUG: "false"
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             gunicorn backend.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120"
    # Bind ЛИШЕ на loopback хоста. Інакше Docker публікує порт власними
    # iptables-правилами В ОБХІД UFW → gunicorn стає доступним з інтернету по
    # незашифрованому HTTP повз nginx/TLS. Назовні працює тільки nginx (80/443).
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # --- infospace stage workers (моніторинг інформпростору) ------------------
  # info-collect — ОДНА репліка (полінг/Telethon-сесія не терплять паралелі).
  # НЕ масштабувати (docker compose up --scale заборонено для цього воркера).
  worker-info-collect:     { <<: *worker, command: python manage.py run_worker --stage info_collect }
  worker-info-screen:      { <<: *worker, command: python manage.py run_worker --stage info_screen }
  worker-info-event:       { <<: *worker, command: python manage.py run_worker --stage info_event }
  worker-info-retention:   { <<: *worker, command: python manage.py run_worker --stage info_retention --interval 3600 }
  worker-info-healthcheck: { <<: *worker, command: python manage.py run_worker --stage info_healthcheck --interval 3600 }

  # --- publish worker (ведення ТГ) ------------------------------------------
  # approved-Event → AI-фільтр+рерайт → Telegram Bot API.
  # ОДНА репліка (пейсинг відправок; кілька реплік дублювали б throttle).
  # Потребує TELEGRAM_BOT_TOKEN в .env (або bot_token на профілі PublishConfig).
  worker-publish:          { <<: *worker, command: python manage.py run_worker --stage publish --interval 30 }

  # --- test-bot worker (accounts.TestBotJob: тестовий прогін бота через акаунт) --
  # TASKLESS: черга з паузою 10-30 хв між акаунтами вже закладена в next-job
  # scheduled_at, тож --interval тут — лише idle-сон між перевірками черги.
  worker-test-bot:         { <<: *worker, command: python manage.py run_worker --stage test_bot --interval 60 }

  # --- warm-up worker (accounts.WarmUpJob: підписка акаунта на випадкові канали) --
  worker-warm-up:          { <<: *worker, command: python manage.py run_worker --stage warm_up --interval 60 }

volumes:
  pgdata:
