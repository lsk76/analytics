name: tg-event-analytics

# Production: gunicorn + DEBUG=false + collectstatic, no source mount.
# Shares the same db volume (pgdata) as dev via the shared project name.

x-worker: &worker
  image: tg-event-analytics-web:latest
  env_file: .env
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: 5432
    DJANGO_DEBUG: "false"
  depends_on:
    db:
      condition: service_healthy
    web:
      condition: service_started
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    # 1GB /dev/shm: важкі хеш-агрегації над мультимільйонною Post (адмін-графіки,
    # матриця) інакше спилялись з "No space left on device" на дефолтних 64MB.
    shm_size: "1gb"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tg_events}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # БД НЕ публікуємо в інтернет. Доступ лише всередині compose-мережі.
    # Для локального дебагу через SSH-тунель — bind на loopback хоста:
    # ports:
    #   - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tg_events}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    image: tg-event-analytics-web:latest
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_DEBUG: "false"
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             gunicorn backend.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120"
    # Bind лише на loopback хоста — назовні gunicorn НЕ світиться, його проксіює
    # nginx (TLS-термінація). У фаєрволі відкриті тільки 80/443, не 8001.
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker-collect:    { <<: *worker, command: python manage.py run_worker --stage collect }
  worker-enrich:     { <<: *worker, command: python manage.py run_worker --stage enrich }
  worker-precluster: { <<: *worker, command: python manage.py run_worker --stage precluster }
  worker-classify:   { <<: *worker, command: python manage.py run_worker --stage classify }
  worker-dedup:      { <<: *worker, command: python manage.py run_worker --stage dedup }
  worker-review:     { <<: *worker, command: python manage.py run_worker --stage review }

volumes:
  pgdata:
